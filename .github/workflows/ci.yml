name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: triagekey-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --directory backend --all-groups
      - run: uv run --directory backend ruff check .
      - run: uv run --directory backend pytest
      # Pin the compiler to the target Preview/Preprod release before enabling this job.
      - run: test -f contracts/TriageKey.compact
      - run: npm run build
