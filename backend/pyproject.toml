[project]
name = "triagekey-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.12", "uvicorn[standard]==0.34.0", "sqlalchemy[asyncio]==2.0.40",
  "aiosqlite==0.21.0", "asyncpg==0.30.0", "alembic==1.15.2", "pydantic-settings==2.8.1",
  "google-genai==1.9.0", "psycopg[binary]==3.2.6"
]
[dependency-groups]
dev = ["pytest==8.3.5", "pytest-asyncio==0.26.0", "httpx==0.28.1", "ruff==0.11.2"]
[tool.pytest.ini_options]
pythonpath = ["."]
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.vercel]
entrypoint = "app.main:app"
